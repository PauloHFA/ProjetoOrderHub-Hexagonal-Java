name: Java CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Architecture Fitness Tests (ArchUnit)
      run: mvn test -Dtest=ArchitectureFitnessTest

    - name: Run Full Test Suite (Unit + E2E MockMvc)
      run: mvn test

