services:
  postgres:
    image: postgres:16-alpine
    container_name: orderhub-postgres-java
    environment:
      POSTGRES_DB: orderhub_java
      POSTGRES_USER: orderhub
      POSTGRES_PASSWORD: orderhub_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata_java:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderhub -d orderhub_java"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_java:

